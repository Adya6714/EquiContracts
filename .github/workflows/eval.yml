name: Evaluation fixtures

on:
  pull_request:
    paths:
      - "eval/**"
      - "packages/extraction/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protect frozen cases
        run: python scripts/check_agent_rules.py

      - name: Validate fixture manifest
        run: python -m packages.extraction.eval_harness --validate-fixtures
