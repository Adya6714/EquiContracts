name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: equicontracts
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPASSWORD: localdev
      POSTGRES_USER: postgres
      POSTGRES_DB: equicontracts
      APP_DATABASE_PASSWORD: localdev
      SYSTEM_DATABASE_PASSWORD: localdev
      DATABASE_URL: postgresql+psycopg://equicontracts_app:localdev@localhost:5432/equicontracts
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:localdev@localhost:5432/equicontracts
      SYSTEM_DATABASE_URL: postgresql+psycopg://equicontracts_system:localdev@localhost:5432/equicontracts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Create application role
        run: packages/db/init/00-app-role.sh

      - name: Apply migrations
        run: |
          for migration in packages/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -U postgres -d equicontracts -f "$migration"
          done

      - name: Agent rule checks
        run: python scripts/check_agent_rules.py

      - name: Lint and format check
        run: |
          ruff check --config apps/api/pyproject.toml apps packages
          ruff format --check --config apps/api/pyproject.toml apps packages

      - name: Typecheck
        run: mypy --config-file apps/api/pyproject.toml apps/api/app

      - name: Tests
        run: pytest -c apps/api/pyproject.toml apps/api/tests

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
