[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
